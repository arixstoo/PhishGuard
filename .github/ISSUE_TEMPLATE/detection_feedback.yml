name: Detection feedback (false positive / false negative)
description: PhishGuard flagged something legitimate, or missed a phishing attempt.
title: "detection: "
labels: ["detection-feedback", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Feedback is reviewed by a human and **never fed automatically into training**
        (this protects the model against poisoning).

        ⚠️ This issue is **public**. Remove names, email addresses, phone numbers, tracking
        tokens and any personal data. **Defang** URLs: `hxxps://evil[.]example/login`.
  - type: dropdown
    id: kind
    attributes:
      label: Type of error
      options:
        - False positive (legitimate content flagged as suspicious or phishing)
        - False negative (phishing not detected)
    validations:
      required: true
  - type: dropdown
    id: channel
    attributes:
      label: Input type
      options:
        - URL
        - SMS / text message
        - Email
    validations:
      required: true
  - type: input
    id: indicator
    attributes:
      label: Defanged URL or domain
      description: Prefer the domain alone when it is enough.
      placeholder: "hxxps://secure-paypa1[.]example/verify"
  - type: textarea
    id: sample
    attributes:
      label: Sanitized sample (optional)
      description: Only the part needed to understand the error, with personal data removed.
      render: text
  - type: input
    id: verdict
    attributes:
      label: Verdict and score returned by PhishGuard
      placeholder: "suspect, 54/100"
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why do you think the verdict is wrong?
      description: e.g. "this is my bank's official domain", "the link imitates a delivery company".
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PhishGuard version / model version
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed all personal data and defanged every URL.
          required: true
