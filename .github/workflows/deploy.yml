name: deploy

# Déploiement automatisé (étape 6.3, docs/deployment.md).
#
#   git tag -s v0.6.0 -m "v0.6.0" && git push origin v0.6.0
#
# 1. build    : image amd64 et arm64 (machines natives), trivy bloquant, test de
#               démarrage, publication sur ghcr.io par empreinte ;
# 2. publish  : index multi-architecture étiqueté <version>, attestation de provenance
#               SLSA signée (Sigstore) poussée avec l'image ;
# 3. deploy   : SSH vers le serveur, clé dédiée dont la seule commande possible est
#               phishguard-deploy (deploy/server/deploy.sh) ; l'image est désignée par
#               empreinte, jamais par étiquette ; retour automatique si la vérification échoue ;
# 4. edge     : proxy Vercel (api-phishguard.vercel.app) régénéré et publié, puis
#               vérification de bout en bout depuis Internet.
#
# Retour arrière en une commande (ou « sudo -u deploy phishguard-deploy rollback ») :
#   gh workflow run deploy.yml -f action=rollback [-f version=v0.6.0]
#
# Secrets de l'environnement GitHub « production » (Settings > Environments) :
#   DEPLOY_HOST, DEPLOY_SSH_PORT, DEPLOY_SSH_KEY (clé privée ed25519 dédiée),
#   DEPLOY_SSH_KNOWN_HOSTS (ssh-keyscan vérifié à la main), PHISHGUARD_ORIGIN_HOST,
#   VERCEL_TOKEN ; variables : VERCEL_ORG_ID, VERCEL_PROJECT_ID.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      action:
        description: Opération sur le serveur
        type: choice
        options: [rollback, status]
        default: rollback
      version:
        description: 'Version cible du retour arrière (vide : la précédente)'
        type: string
        required: false

# Aucun droit par défaut : chaque job déclare les siens.
permissions: {}

# Un seul déploiement à la fois, jamais annulé en cours de route.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/arixstoo/phishguard-api
  PUBLIC_URL: https://api-phishguard.vercel.app
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
  VERCEL_CLI: vercel@65.11.0

jobs:
  build:
    if: github.event_name == 'push'
    name: Image ${{ matrix.arch }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # L'étiquette doit être la version du paquet (v0.6.0 ↔ 0.6.0, v0.6.0-beta.1 ↔ 0.6.0b1) :
      # GET /v1/model et les journaux annoncent alors la version réellement déployée.
      - name: Version de l'étiquette et du paquet
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re, sys, tomllib
          tag = os.environ["TAG"]
          match = re.fullmatch(r"v(\d+\.\d+\.\d+)(?:-(alpha|beta|rc)\.(\d+))?", tag)
          if not match:
              sys.exit(f"étiquette refusée : {tag} (vX.Y.Z ou vX.Y.Z-beta.N)")
          base, stage, number = match.groups()
          expected = base + ({"alpha": "a", "beta": "b", "rc": "rc"}[stage] + number if stage else "")
          actual = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          if actual != expected:
              sys.exit(f"pyproject.toml annonce {actual}, l'étiquette {tag} attend {expected}")
          print(f"version {actual}")
          PY

      - name: Construction
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ github.ref_name }}
        run: |
          docker build --target runtime \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$IMAGE:$VERSION-$ARCH" .

      - name: trivy image (bloquant)
        env:
          REF: ${{ env.IMAGE }}:${{ github.ref_name }}-${{ matrix.arch }}
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock:ro \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" "$TRIVY_IMAGE" \
            image --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 --no-progress "$REF"

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.8'

      # Même test que security.yml (étape 4.9), sur l'image exacte qui sera publiée.
      - name: Test de démarrage (modèles synthétiques signés)
        env:
          REF: ${{ env.IMAGE }}:${{ github.ref_name }}-${{ matrix.arch }}
          PHISHGUARD_MODELS_HOST_DIR: ${{ runner.temp }}/models
          PHISHGUARD_MODELS_PUBLIC_KEY_HOST: ${{ runner.temp }}/ephemeral/signing.pub
        run: |
          run() { uv run --locked --extra dev --python 3.12 "$@"; }
          run python scripts/smoke_models.py --output-dir "$RUNNER_TEMP/models"
          run python scripts/sign_models.py keygen \
            --private-key "$RUNNER_TEMP/ephemeral/signing.key" \
            --public-key "$RUNNER_TEMP/ephemeral/signing.pub"
          run python scripts/sign_models.py sign \
            --private-key "$RUNNER_TEMP/ephemeral/signing.key" --models-dir "$RUNNER_TEMP/models"
          rm "$RUNNER_TEMP/ephemeral/signing.key"
          chmod -R a+rX "$RUNNER_TEMP/models" "$RUNNER_TEMP/ephemeral"
          docker tag "$REF" phishguard-api:local
          docker compose up --no-build --detach --wait --wait-timeout 120
          bash scripts/docker_smoke.sh http://127.0.0.1:8000
          docker compose down --volumes

      - name: Publication par empreinte
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push --quiet "$IMAGE:$VERSION-$ARCH"
          digest="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' \
            "$IMAGE:$VERSION-$ARCH" | grep -m1 "^$IMAGE@" | cut -d@ -f2)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "empreinte introuvable" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s\n' "$digest" > "$RUNNER_TEMP/digests/$ARCH"
          docker logout ghcr.io

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.arch }}
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Index multi-architecture et provenance
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write # signature Sigstore sans clé de l'attestation
      attestations: write
    outputs:
      digest: ${{ steps.index.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Index multi-architecture
        id: index
        env:
          VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          sources=()
          for arch in amd64 arm64; do
            digest="$(cat "$RUNNER_TEMP/digests/$arch")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "empreinte $arch invalide" >&2; exit 1; }
            sources+=("$IMAGE@$digest")
          done
          docker buildx imagetools create --tag "$IMAGE:$VERSION" "${sources[@]}"
          digest="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "empreinte de l'index invalide" >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "### Image publiée" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$IMAGE@$digest\` ($VERSION)" >> "$GITHUB_STEP_SUMMARY"
          docker logout ghcr.io

      # Vérifiable par quiconque : gh attestation verify oci://ghcr.io/arixstoo/phishguard-api:<v> --owner arixstoo
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

  deploy:
    name: Serveur
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Clé SSH dédiée
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 ~/.ssh
          ( umask 077; printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key )
          # Empreinte du serveur fournie, jamais apprise à la volée (StrictHostKeyChecking=yes).
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: phishguard-deploy
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          VERSION: ${{ github.ref_name }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          tar --create --file - --directory deploy compose.prod.yml Caddyfile \
            | ssh -i ~/.ssh/deploy_key -p "$PORT" -o IdentitiesOnly=yes -o BatchMode=yes \
                -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 \
                "deploy@$HOST" "deploy $VERSION $IMAGE@$DIGEST"

      - name: Nettoyage de la clé
        if: always()
        run: rm -f ~/.ssh/deploy_key

  edge:
    name: Proxy Vercel et vérification publique
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ env.PUBLIC_URL }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configuration du proxy
        env:
          ORIGIN_HOST: ${{ secrets.PHISHGUARD_ORIGIN_HOST }}
        run: python3 scripts/render_edge_config.py proxy --origin-host "$ORIGIN_HOST"

      - name: vercel deploy --prod
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: npx --yes "$VERCEL_CLI" deploy deploy/edge/dist --prod --yes

      - name: Santé depuis Internet
        run: bash scripts/edge_smoke.sh "$PUBLIC_URL"

  server-operation:
    if: github.event_name == 'workflow_dispatch'
    name: ${{ inputs.action }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions: {}
    steps:
      - name: Clé SSH dédiée
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 ~/.ssh
          ( umask 077; printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key )
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # Entrées passées par l'environnement et validées : jamais interpolées dans le script.
      - name: phishguard-deploy ${{ inputs.action }}
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          ACTION: ${{ inputs.action }}
          TARGET: ${{ inputs.version }}
        run: |
          [[ "$ACTION" == rollback || "$ACTION" == status ]] || exit 1
          if [[ -n "$TARGET" ]]; then
            [[ "$ACTION" == rollback && "$TARGET" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] \
              || { echo "version invalide" >&2; exit 1; }
          fi
          ssh -i ~/.ssh/deploy_key -p "$PORT" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "deploy@$HOST" "$ACTION${TARGET:+ $TARGET}" < /dev/null

      - name: Nettoyage de la clé
        if: always()
        run: rm -f ~/.ssh/deploy_key
