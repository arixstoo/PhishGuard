name: ci

on: [push, pull_request]

# Moindre privilège : le jeton GITHUB_TOKEN ne peut que lire le dépôt.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions épinglées par SHA de commit (une étiquette peut être déplacée vers un autre
# code) ; la version lisible est en commentaire, Dependabot met les deux à jour.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupération du code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Installation d'uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.12.13'

      # --locked : échoue si uv.lock ne correspond plus à pyproject.toml. Les versions et
      # les empreintes installées sont exactement celles du fichier de verrouillage.
      - name: Installation des dépendances (uv.lock)
        run: |
          uv sync --locked --extra dev --python 3.12
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Contrôle qualité avec Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Exécution des tests avec couverture
        # Seuil : voir COVERAGE_MIN dans le Makefile. Profil ci : la graine d'un échec
        # hypothesis est affichée pour le rejouer en local.
        run: pytest --cov=phishguard --cov-report=term --cov-fail-under=90 --hypothesis-profile=ci

  fuzz:
    # Étape 4.7 : 1 000 exemples par propriété (parseurs d'URL et d'email, normalisation,
    # API). Séparé des tests pour ne pas ralentir le retour sur chaque commit.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupération du code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Installation d'uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.12.13'

      - name: Installation des dépendances (uv.lock)
        run: |
          uv sync --locked --extra dev --python 3.12
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Fuzzing hypothesis (profil fuzz)
        run: pytest -m fuzz --hypothesis-profile=fuzz --hypothesis-show-statistics -q
