name: extension

# Extension navigateur (module 5) : types, parité avec Python, build, audit npm et parcours
# Playwright (extension, maquette Gmail, page « coller et analyser » de l'API).
on:
  push:
    paths:
      - "extension/**"
      - "docs/extension-privacy.md"
      - "src/phishguard/api/static/**"
      - "src/phishguard/api/routers/web.py"
      - "tests/golden/**"
      - "scripts/export_extension_data.py"
      - "src/phishguard/urls/**"
      - "src/phishguard/security/normalize.py"
      - "src/phishguard/email/html.py"
      - "src/phishguard/email/parser.py"
      - "src/phishguard/explain/templates.*.yml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/extension.yml"
  pull_request:
    paths:
      - "extension/**"
      - "docs/extension-privacy.md"
      - "src/phishguard/api/static/**"
      - "src/phishguard/api/routers/web.py"
      - "tests/golden/**"
      - "scripts/export_extension_data.py"
      - "src/phishguard/urls/**"
      - "src/phishguard/security/normalize.py"
      - "src/phishguard/email/html.py"
      - "src/phishguard/email/parser.py"
      - "src/phishguard/explain/templates.*.yml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/extension.yml"

# Moindre privilège : le jeton GITHUB_TOKEN ne peut que lire le dépôt.
permissions:
  contents: read

concurrency:
  group: extension-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: extension

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupération du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installation de Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: extension/package-lock.json

      # npm ci : exactement package-lock.json (versions et empreintes) ; .npmrc interdit
      # les scripts d'installation.
      - name: Installation des dépendances (package-lock.json)
        run: npm ci

      - name: Audit des dépendances npm
        run: npm audit --audit-level=moderate

      # Chaque paquet installé porte la signature du registre npm (étape 5.9).
      - name: Signatures du registre npm
        run: npm audit signatures

      - name: Vérification des types
        run: npm run typecheck

      # Sans le modèle (non versionné) : parité composant par composant, fuzzing
      # différentiel, 24 des 25 features des vecteurs de référence, modèles synthétiques.
      - name: Tests de parité avec Python
        run: npm test

      - name: Build (sans modèle)
        run: node build.mjs --allow-missing-model

      # Fiche des stores (étape 6.9) : limites, langues, une justification par autorisation,
      # aucune donnée collectée, libellés cités qui existent dans l'interface.
      - name: Fiche des stores
        run: npm run store -- --check

      # Firefox (étape 6.10) : même code, manifeste dérivé ; web-ext a son propre
      # package-lock.json (extension/tools/web-ext), hors de l'arbre de l'extension.
      - name: Build et lint Firefox (sans modèle)
        run: |
          npm ci --prefix tools/web-ext
          node build.mjs --allow-missing-model --browser=firefox
          npm run lint:firefox

  e2e:
    # Parcours de bout en bout dans Chromium (étape 5.10) : extension chargée, fenêtre
    # contextuelle au clavier, langues, options, maquette Gmail (10 messages), et aucune
    # requête hors du paquet. Modèle de test (e2e/stub-model.mjs) : le modèle signé n'est
    # pas versionné ; il donne les mêmes verdicts sur ces parcours (test/stub-model.test.ts).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupération du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installation de Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Installation des dépendances (package-lock.json)
        run: npm ci

      # Version de Chromium fixée par celle de @playwright/test (package-lock.json).
      - name: Installation de Chromium
        run: npx playwright install --with-deps chromium

      - name: Build de test (modèle de test)
        run: npm run build:e2e

      - name: Parcours Playwright
        run: npx playwright test

      - name: Traces des tests en échec
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: extension/test-results/
          retention-days: 7

  data:
    # Les données et les cas de parité de l'extension (src/generated, python-parity.json)
    # doivent être ceux que produit le code Python actuel : sinon les tests TypeScript
    # passeraient contre des cas périmés. Python 3.13 : la version d'Unicode des fichiers
    # (15.1) ; sous une autre version, --check sauterait la comparaison.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - name: Récupération du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installation d'uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.8'

      - name: Installation des dépendances (uv.lock)
        run: |
          uv sync --locked --extra dev --python 3.13
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Données de l'extension à jour (make extension-data)
        run: |
          python -c "import unicodedata, sys; assert unicodedata.unidata_version == '15.1.0', unicodedata.unidata_version"
          python scripts/export_extension_data.py --check
