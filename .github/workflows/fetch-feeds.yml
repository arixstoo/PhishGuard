name: Scheduled Feed Fetch

on:
  schedule:
    # Tous les jours à 04:00 UTC (la liste Tranco de la veille est publiée vers 22:00 UTC)
    - cron: '0 4 * * *'
  workflow_dispatch: # Déclenchement manuel depuis l'onglet Actions

permissions:
  contents: read

concurrency:
  group: fetch-feeds
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install httpx==0.28.1
      - name: Run feed collection
        env:
          URLHAUS_AUTH_KEY: ${{ secrets.URLHAUS_AUTH_KEY }}
          PHISHTANK_APP_KEY: ${{ secrets.PHISHTANK_APP_KEY }}
        run: python scripts/fetch_feeds.py --output-dir data/raw
      # Dépôt public : les artefacts sont visibles par tout compte GitHub. Les conditions
      # d'OpenPhish interdisent la redistribution, donc on ne dépose qu'une archive chiffrée.
      # On archive même une collecte partielle : les flux de phishing ne se rattrapent pas.
      - name: Encrypt archive
        if: always()
        env:
          ARCHIVE_PASSPHRASE: ${{ secrets.ARCHIVE_PASSPHRASE }}
        run: |
          if [ -z "$ARCHIVE_PASSPHRASE" ]; then
            echo "::error::Secret ARCHIVE_PASSPHRASE absent : aucune archive déposée."
            exit 1
          fi
          tar -czf feeds.tar.gz -C data raw
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in feeds.tar.gz -out "feeds-${{ github.run_id }}.tar.gz.enc" \
            -pass env:ARCHIVE_PASSPHRASE
          rm feeds.tar.gz
      - name: Upload encrypted archive
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: feeds-${{ github.run_id }}
          path: feeds-${{ github.run_id }}.tar.gz.enc
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
