# Dependabot (étape 4.8) : mises à jour de version, en plus des alertes de sécurité.
#
# - uv : uv.lock (dépendances Python, épinglées avec leurs empreintes) ;
# - github-actions : actions épinglées par SHA, commentaire de version compris ;
# - docker : images de base du Dockerfile (python, uv), étiquette et empreinte ensemble
#   (étape 4.9). Python reste en 3.12 : une version mineure de l'interpréteur se change
#   à la main, avec uv.lock et la CI.
#
# - npm : extension/package-lock.json (module 5), versions exactes conservées.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    labels: [dependencies, python]
    commit-message:
      prefix: deps
    groups:
      # Correctifs et versions mineures regroupés ; une version majeure a sa propre PR.
      python-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Paris
    labels: [dependencies, ci]
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Paris
    labels: [dependencies, docker]
    commit-message:
      prefix: deps
    ignore:
      # python:3.12-slim-trixie → 3.13 : changement d'interpréteur, pas une mise à jour.
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]

  # Images de production épinglées par empreinte (Caddy, Uptime Kuma, étape 6.2).
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Paris
    labels: [dependencies, docker]
    commit-message:
      prefix: deps

  # Extension navigateur (module 5) : versions exactes et package-lock.json ; npm ne lance
  # aucun script d'installation (.npmrc ignore-scripts=true).
  - package-ecosystem: npm
    directory: /extension
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    labels: [dependencies, javascript]
    commit-message:
      prefix: deps
    groups:
      npm-minor:
        update-types: [minor, patch]
