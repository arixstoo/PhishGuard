  email.credential_form_attachment: "An attached page asks for a password: a legitimate service never does this by attachment."
  email.archive_attachment: "An archive is attached: its content cannot be checked without opening it."
  email.hidden_text: "The email contains hidden text, often used to fool filters."
  email.zero_width_chars: "Invisible characters split words, often to fool filters."
  email.urgent_account_request: "The message pressures you to act on an account, a card or a parcel."

advice:
  url.phishing: "Do not enter any password or bank details. Open the site by typing its address yourself."
  url.suspicious: "Be careful: do not type anything on this page. If in doubt, open the official site by typing its address yourself."
  url.safe: "No worrying signs. Stay alert if the page asks for a password or a payment."
  email.phishing: "Do not open any link or attachment and do not reply. Contact the organisation through its official details."
  email.suspicious: "Be careful: do not open links or attachments until you have checked the sender another way."
  email.safe: "No worrying signs. Stay alert if the email asks for a password, a code or a payment."
  message.phishing: "Do not click the link and do not reply. Contact the organisation through its official number or website."
  message.suspicious: "Be careful: do not click and do not share any code until you have checked the sender another way."
  message.safe: "No worrying signs. Never share a code received by message, even with someone claiming to be your bank."
