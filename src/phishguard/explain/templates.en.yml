  url.many_hyphens: "The site name contains many hyphens ({n})."
  url.many_digits: "The site name contains many digits ({n})."

  signal.domain_age: "This site was created only {n} days ago."
  signal.rdap: "This site was created recently."
  signal.virustotal: "VirusTotal antivirus engines report this site as dangerous."
  signal.virustotal_engines: "{n} VirusTotal antivirus engines report this site as dangerous."
  signal.urlscan: "urlscan.io found the page suspicious during an isolated visit."
  signal.dns: "The site's technical setup looks like that of throwaway sites."
  signal.certificate_transparency: "The site's security certificate is very recent."
  signal.other: "The source {source} reports a risk."

  text.model: "The style of this message looks like known fraudulent messages."
  text.terms: "Words like \"{terms}\" often appear in fraudulent messages."
  text.urgency: "The message pressures you to act fast or threatens a penalty."
  text.money: "The message talks about money: a payment, a prize or a refund."
  text.link: "The message pushes you to open a link."
  text.code: "The message mentions a code or a password: never share it."
  text.account: "The message mentions your account, your card or a parcel."

  email.dmarc_fail: "The sender's domain did not authorise this email."
  email.spf_fail: "The server that sent this email is not authorised by the sender's domain."
  email.spf_softfail: "The server that sent this email is probably not authorised by the sender's domain."
  email.dkim_fail: "The email's signature is invalid: it may have been altered or forged."
  email.reply_to_differs: "Your reply would go to a different address than the sender's."
  email.display_name_spoof: "The display name imitates an address other than the sender's real one."
  email.return_path_differs: "The return address is on another domain (common for bulk mailings)."
  email.mismatched_link: "The link shown does not lead where it claims to."
  email.non_web_link: "A link runs code instead of opening a page."
  email.form: "The email contains a form: a legitimate service sends you to its website instead."
  email.ip_link: "A link leads to a numeric address (IP address) instead of a site name."
  email.url_model: "A link looks like known phishing links."
  email.shortener_link: "A link goes through a URL shortener that hides its real destination."
  email.dangerous_attachment: "An attachment can launch a program or open a fake sign-in page."
