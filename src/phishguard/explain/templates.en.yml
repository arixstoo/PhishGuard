# User-facing reason templates, in English (step 3.2).
#
# Same keys and placeholders as templates.fr.yml (checked by the tests). Writing rules:
# one short sentence, plain words, a verifiable observation rather than an accusation.

language: en
version: 1

reasons:
  hard_rule.blocklist: "This site is on your personal blocklist."
  hard_rule.google_safe_browsing: "Google Safe Browsing reports this page as dangerous."
  hard_rule.allowlist: "This site is on your personal allowlist."

  model: "The shape of this address looks like known phishing links."

  url.brand_lookalike: "The address looks like {brand}'s, but it is not theirs."
  url.homograph: "The address imitates {brand} with characters that look like Latin letters."
  url.mixed_script: "The address mixes letters from different alphabets to imitate a well-known site."
  url.brand_in_host: "The address contains the name {brand}, but it is not an official {brand} site."
  url.brand_in_path: "The link mentions {brand}, but the site does not belong to {brand}."
  url.ip_host: "The link leads to a numeric address (IP address) instead of a site name."
  url.userinfo: "The address contains an \"@\" that hides the site actually visited."
  url.port: "The link uses an unusual network entry point (port)."
  url.shortener: "The link goes through a URL shortener that hides its real destination."
  url.risky_tld: "The \".{tld}\" extension is very often used by phishing sites."
  url.login_keywords: "The address contains words like \"login\" or \"verify\", typical of fake sign-in pages."
