repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Filet de sécurité en plus de .gitignore : refuse un .env ajouté de force (git add -f).
  - repo: local
    hooks:
      - id: forbid-env-files
        name: Refuse les fichiers .env
        entry: les fichiers .env contiennent des secrets et ne se commitent jamais (seul .env.example est autorisé)
        language: fail
        files: (^|/)\.env(\..+)?$
        exclude: (^|/)\.env\.example$
      - id: forbid-private-keys
        name: Refuse les clés privées
        entry: une clé privée ne se commite jamais (signature des modèles, docs/model-registry.md)
        language: fail
        files: \.(key|pem|p8|p12)$
      - id: detect-private-key-content
        name: Refuse un contenu de clé privée
        entry: 'PRIVATE KEY-----'
        language: pygrep
        exclude: ^\.pre-commit-config\.yaml$  # ce fichier contient le motif
