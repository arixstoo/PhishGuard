[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "phishguard"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "scikit-learn",
    "lightgbm",
    "tldextract",
    "rapidfuzz",
    "beautifulsoup4",
    "joblib",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "pre-commit",
    "hypothesis",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
