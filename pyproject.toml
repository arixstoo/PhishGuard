[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "phishguard"
version = "0.3.0"
description = "Open-source, explainable and privacy-first phishing detection (URL, SMS, email)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "arixstoo" }]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",  # lecture et écriture parquet (data/processed/)
    "scikit-learn",
    "lightgbm",
    "tldextract",
    "rapidfuzz",
    "beautifulsoup4",
    "joblib",
    "httpx",
    "pydantic>=2",
    "pydantic-settings>=2.1",  # clés d'API chargées depuis .env (étape 2.1)
    "aiolimiter>=1.1",  # limite de débit locale des API à quota (étape 2.5)
    "dnspython>=2.4",  # enregistrements DNS des domaines analysés (étape 2.7)
    "tenacity>=8.2",  # nouvelles tentatives sur les erreurs temporaires (étape 2.8)
    "cachetools>=5.3",  # cache à durée de vie des réponses des sources (étape 2.8)
    "olefile>=0.46",  # macros des documents Office 97-2003 joints aux emails (étape 2.13)
    "pyyaml>=6.0",  # gabarits des raisons lisibles, lus avec safe_load (étape 3.2)
    # API HTTP (module 4)
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.20",  # téléversement des .eml ; < 0.0.18 : CVE-2024-53981
    "limits>=4.0",  # limites de débit, stockage asynchrone (étape 4.4)
    "structlog>=24.1",  # journal structuré sans données personnelles (étape 4.6)
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff==0.17.1",  # même version que .pre-commit-config.yaml
    "pre-commit",
    "hypothesis",
    "respx",  # réponses HTTP simulées pour les enrichisseurs (module 2)
    "shap>=0.46",  # les tests comparent les valeurs SHAP de LightGBM à la référence (étape 3.1)
    "bandit>=1.8",  # analyse statique du code (étape 4.8)
    "pip-audit>=2.7",  # dépendances vulnérables connues (étape 4.8)
]
# Graphiques SHAP de `make explain-url` (étape 3.1). L'analyse elle-même n'en a pas besoin :
# les valeurs SHAP du modèle URL sont calculées par LightGBM.
explain = ["shap>=0.46", "matplotlib"]
# Approche optionnelle de l'étape 1.9 : télécharge un encodeur de plusieurs centaines de Mo.
embeddings = ["sentence-transformers"]

[project.urls]
Repository = "https://github.com/arixstoo/PhishGuard"
Issues = "https://github.com/arixstoo/PhishGuard/issues"

[tool.setuptools.package-data]
# Listes de référence des features URL, relues aussi par l'extension (module 5),
# paramètres versionnés de la fusion du score (étape 2.10) et gabarits des raisons
# lisibles en trois langues (étape 3.2).
phishguard = ["urls/data/*.json", "fusion/*.json", "explain/*.yml"]

[tool.ruff]
line-length = 100
# Code d'origine (tag v0-legacy) et cahier des charges : conservés tels quels.
extend-exclude = ["notebooks/legacy", "*Cahier des charges*.md"]
force-exclude = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "fuzz: propriétés hypothesis des parseurs et de l'API (étape 4.7) ; make fuzz en lance 1 000 exemples",
]
