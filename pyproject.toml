[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "phishguard"
version = "0.2.0"
description = "Open-source, explainable and privacy-first phishing detection (URL, SMS, email)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "arixstoo" }]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",  # lecture et écriture parquet (data/processed/)
    "scikit-learn",
    "lightgbm",
    "tldextract",
    "rapidfuzz",
    "beautifulsoup4",
    "joblib",
    "httpx",
    "pydantic>=2",
    "pydantic-settings>=2.1",  # clés d'API chargées depuis .env (étape 2.1)
    "aiolimiter>=1.1",  # limite de débit locale des API à quota (étape 2.5)
    "dnspython>=2.4",  # enregistrements DNS des domaines analysés (étape 2.7)
    "tenacity>=8.2",  # nouvelles tentatives sur les erreurs temporaires (étape 2.8)
    "cachetools>=5.3",  # cache à durée de vie des réponses des sources (étape 2.8)
    "olefile>=0.46",  # macros des documents Office 97-2003 joints aux emails (étape 2.13)
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff==0.17.1",  # même version que .pre-commit-config.yaml
    "pre-commit",
    "hypothesis",
    "respx",  # réponses HTTP simulées pour les enrichisseurs (module 2)
]
# Approche optionnelle de l'étape 1.9 : télécharge un encodeur de plusieurs centaines de Mo.
embeddings = ["sentence-transformers"]

[project.urls]
Repository = "https://github.com/arixstoo/PhishGuard"
Issues = "https://github.com/arixstoo/PhishGuard/issues"

[tool.setuptools.package-data]
# Listes de référence des features URL, relues aussi par l'extension (module 5), et
# paramètres versionnés de la fusion du score (étape 2.10).
phishguard = ["urls/data/*.json", "fusion/*.json"]

[tool.ruff]
line-length = 100
# Code d'origine (tag v0-legacy) et cahier des charges : conservés tels quels.
extend-exclude = ["notebooks/legacy", "*Cahier des charges*.md"]
force-exclude = true

[tool.pytest.ini_options]
testpaths = ["tests"]
